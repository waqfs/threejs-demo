<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Three.js Playground</title>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main>
      <nav id="navigation" aria-label="Playground presets">
        <div id="presets"></div>
        <button type="button" id="theme" class="icon-button" aria-label="Change color theme">
          <svg class="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          <svg class="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 14.1A9 9 0 0 1 9.9 3.2 9 9 0 1 0 20.8 14.1Z"/></svg>
        </button>
      </nav>

      <div id="workspace">
        <section id="code-panel" aria-labelledby="code-heading">
          <div class="toolbar">
            <h1 id="code-heading">Code</h1>
            <div class="actions">
              <button type="button" id="reset-code" class="text-button" title="Restore this preset’s starter code">Reset</button>
              <button type="button" id="run" class="run-button" title="Run code (Ctrl or ⌘ + Enter)">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path class="play" d="M8 5.5v13l10-6.5Z"/></svg>Run
              </button>
            </div>
          </div>
          <div id="editor"></div>
          <div id="status" role="status" class="status" data-state="loading">
            <span id="status-dot" aria-hidden="true"></span><span id="message">Loading preview…</span>
          </div>
        </section>

        <div id="divider" role="separator" tabindex="0" aria-label="Resize code and preview panes" aria-orientation="vertical" aria-controls="code-panel" aria-valuemin="30" aria-valuemax="70" aria-valuenow="50"></div>

        <section id="preview-panel" aria-labelledby="preview-heading">
          <div class="toolbar">
            <h2 id="preview-heading">Preview</h2>
            <div class="actions">
              <button type="button" id="reset-view" class="icon-button" aria-label="Reset view" title="Reset view">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2.2 6.7M4 5v6h6"/></svg>
              </button>
              <button type="button" id="expand" class="icon-button" aria-expanded="false" aria-controls="preview-panel" aria-label="Expand preview" title="Expand preview">
                <svg class="maximize" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5m0 6v5h-5m-6 0H4v-5"/></svg>
                <svg class="minimize" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9h5V4m11 5h-5V4m0 16v-5h5m-11 5v-5H4"/></svg>
              </button>
            </div>
          </div>
          <div class="viewport">
            <iframe id="preview" title="Interactive Three.js preview" sandbox="allow-scripts"></iframe>
            <p id="preview-error" hidden></p>
          </div>
          <div class="view-footer">
            <span class="desktop-hint">Drag to orbit <span aria-hidden="true">·</span> Scroll to zoom</span>
            <span class="touch-hint">Drag to orbit <span aria-hidden="true">·</span> Pinch to zoom</span>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
